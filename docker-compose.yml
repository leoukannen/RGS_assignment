services:
  app:
    build: .
    container_name: app
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./python-docker-src:/app
    environment:
      MONGO_URI: mongodb://mongodb:27017/app
    command: python src/main.py

  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongodb_data: